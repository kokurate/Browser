<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-test123';">
    <title>Blob URL CSP Test</title>
</head>

<body>
    <h1>Blob URL CSP Test</h1>
    <div id="link"></div>

    <script nonce="test123">
        document.cookie = "session=secret123";

        const html = `<!DOCTYPE html>
<html>
<body>
<script>
const iframe = document.createElement('iframe');
iframe.src = window.origin;
iframe.style.display = 'none';
iframe.onload = () => {
    alert('Stolen cookie: ' + iframe.contentDocument.cookie);
};
document.body.appendChild(iframe);
<\/script>
</body>
</html>`;
        const blob = new Blob([html], {
            type: 'text/html'
        });
        const url = URL.createObjectURL(blob);

        document.getElementById('link').innerHTML = `<a href="${url}" target="_blank">Click</a>`;
    </script>
</body>

</html>
